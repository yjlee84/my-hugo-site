<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">HCQO data validation workflow</title>
  <desc id="desc">Country delegates submit CSV data that are standardised and validated. Detected issues generate reports for correction and revalidation. Validated data proceed through indicator calculations, a review dashboard, database-ready output, and the OECD Data Explorer.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#158f91"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d68a18"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #587084; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #587084; }
      .white { fill: #ffffff; }
      .line { fill: none; stroke: #158f91; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-teal); }
      .branch { fill: none; stroke: #d68a18; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
    </style>
  </defs>

  <rect x="15" y="15" width="1170" height="1150" rx="34" fill="#f7fafb" stroke="#dce8eb" stroke-width="2"/>
  <text x="600" y="65" text-anchor="middle" class="title">From country submissions to validated health data</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">An automated quality-assurance and processing workflow</text>

  <!-- Main workflow connectors -->
  <path class="line" d="M 410 204 L 410 244"/>
  <path class="line" d="M 410 334 L 410 374"/>
  <path class="line" d="M 410 464 L 410 530"/>
  <path class="line" d="M 410 620 L 410 665"/>
  <path class="line" d="M 410 755 L 410 800"/>
  <path class="line" d="M 410 890 L 410 935"/>
  <path class="line" d="M 410 1025 L 410 1065"/>

  <!-- Delegate -->
  <rect x="235" y="124" width="350" height="80" rx="20" fill="#e6f4f4" stroke="#73c5c3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="285" cy="164" r="22" fill="#158f91"/>
  <circle cx="285" cy="156" r="7" class="white"/>
  <path d="M269 177c3-10 29-10 32 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="325" y="172" class="label">Country delegates</text>

  <!-- CSV -->
  <rect x="235" y="244" width="350" height="90" rx="20" fill="#ffffff" stroke="#b8cdd4" stroke-width="2" filter="url(#shadow)"/>
  <path d="M270 263h39l18 18v36h-57z" fill="#dceff1" stroke="#158f91" stroke-width="2"/>
  <path d="M309 263v18h18" fill="none" stroke="#158f91" stroke-width="2"/>
  <text x="340" y="283" class="label">CSV data submissions</text>
  <text x="340" y="311" class="small">Current and historical observations</text>

  <!-- Standardisation -->
  <rect x="235" y="374" width="350" height="90" rx="20" fill="#ffffff" stroke="#73c5c3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="290" cy="419" r="25" fill="#e6f4f4"/>
  <path d="M276 410h28M276 419h28M276 428h28" stroke="#158f91" stroke-width="4" stroke-linecap="round"/>
  <text x="335" y="413" class="label">Standardise data</text>
  <text x="335" y="441" class="small">Structure, labels and formats</text>

  <!-- Validation -->
  <rect x="150" y="530" width="520" height="90" rx="20" fill="#158f91" filter="url(#shadow)"/>
  <circle cx="205" cy="575" r="25" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M192 575l9 9 18-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="566" class="label white">Automated quality checks</text>
  <text x="250" y="594" style="font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Structure · entries · completeness · consistency · outliers</text>

  <!-- Error branch -->
  <path class="branch" d="M 670 575 L 720 575 L 720 285 L 760 285"/>
  <text x="720" y="520" text-anchor="middle" style="font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#a4640e">Issues found</text>

  <rect x="760" y="235" width="395" height="100" rx="20" fill="#fff6e7" stroke="#e7b357" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="810" cy="285" r="24" fill="#d68a18"/>
  <path d="M810 269v19M810 299v1" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="850" y="278" class="label">CSV validation report</text>
  <text x="850" y="307" class="small">Affected observations identified</text>

  <path class="branch" d="M 958 335 L 958 395"/>
  <rect x="760" y="395" width="395" height="100" rx="20" fill="#ffffff" stroke="#e7b357" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="810" cy="445" r="24" fill="#fff0d4"/>
  <path d="M799 448l8 8 16-22" fill="none" stroke="#d68a18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="438" class="label">Locate and correct</text>
  <text x="850" y="467" class="small">Delegates revise flagged data</text>

  <path class="branch" d="M 958 495 L 958 650 L 710 650 L 710 605 L 670 605"/>
  <text x="825" y="678" text-anchor="middle" class="small" fill="#a4640e">Revalidate</text>

  <!-- Calculation -->
  <rect x="235" y="665" width="350" height="90" rx="20" fill="#ffffff" stroke="#73c5c3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="290" cy="710" r="25" fill="#e6f4f4"/>
  <text x="290" y="718" text-anchor="middle" style="font:700 23px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#158f91">ƒx</text>
  <text x="335" y="704" class="label">Calculate indicators</text>
  <text x="335" y="732" class="small">Rates and confidence intervals</text>

  <!-- Dashboard -->
  <rect x="235" y="800" width="350" height="90" rx="20" fill="#ffffff" stroke="#73c5c3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="290" cy="845" r="25" fill="#e6f4f4"/>
  <path d="M276 858v-18M289 858v-30M302 858v-12" stroke="#158f91" stroke-width="5" stroke-linecap="round"/>
  <text x="335" y="839" class="label">Review dashboard</text>
  <text x="335" y="867" class="small">Inspect patterns and results</text>

  <!-- Database output -->
  <rect x="235" y="935" width="350" height="90" rx="20" fill="#ffffff" stroke="#73c5c3" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="290" cy="966" rx="25" ry="10" fill="#e6f4f4" stroke="#158f91" stroke-width="3"/>
  <path d="M265 966v24c0 6 11 10 25 10s25-4 25-10v-24M265 978c0 6 11 10 25 10s25-4 25-10" fill="#e6f4f4" stroke="#158f91" stroke-width="3"/>
  <text x="335" y="974" class="label">Database-ready output</text>
  <text x="335" y="1002" class="small">Consistent, reproducible results</text>

  <!-- Explorer -->
  <rect x="205" y="1065" width="410" height="80" rx="20" fill="#24724f" filter="url(#shadow)"/>
  <circle cx="260" cy="1105" r="24" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M247 1112l9-13 9 6 11-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="305" y="1113" class="label white">OECD Data Explorer</text>
</svg>
